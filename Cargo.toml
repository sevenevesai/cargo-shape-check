[package]
name = "cargo-shape-check"
version = "0.1.5"
edition = "2024"
description = "Hash the public API surface of workspace crates to detect private-only vs public-facing changes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sevenevesai/cargo-shape-check"
homepage = "https://seveneves.ai/crates"
keywords = ["cargo", "incremental", "compilation", "build", "hash"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]
readme = "README.md"

[[bin]]
name = "cargo-shape-check"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "printing", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
