[package]
name = "cargo-shape-check"
version = "0.1.1"
edition = "2021"
description = "Skip unnecessary downstream crate rebuilds by hashing only the public API surface"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sevenevesai/cargo-shape-check"
keywords = ["cargo", "incremental", "compilation", "build", "hash"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]
readme = "README.md"

[[bin]]
name = "cargo-shape-check"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "printing", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
